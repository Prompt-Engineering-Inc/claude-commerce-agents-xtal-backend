[pytest]
# Mirrors the upstream pytest.ini so its contract module runs unchanged here.
addopts = -p asyncio --import-mode=importlib
asyncio_mode = auto
# demo_common and retail are top-level packages under the vendored examples/, as uvicorn
# --app-dir runs them; examples/ holds this repo's retail_on_xtal host.
pythonpath = . vendor/commerce-agents/examples examples
testpaths = tests
markers =
    live: calls the XTAL API; runs only with XTAL_LIVE=1
